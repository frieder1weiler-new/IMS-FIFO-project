{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col h-[calc(100vh-140px)] space-y-3 overflow-hidden px-1">
    
    <div class="flex justify-between items-center border-b border-gray-800 pb-2 shrink-0">
        <div>
            <h1 class="text-xl font-black tracking-tight text-white uppercase">Production Matrix</h1>
            <p class="text-xs text-gray-400">Live column-based component buffer tracking for shop floor line operators.</p>
        </div>
        <div class="bg-gray-900 border border-gray-700 px-3 py-1 rounded font-mono text-xs flex items-center space-x-2">
            <span class="h-2 w-2 rounded-full bg-indigo-500 animate-ping"></span>
            <span class="text-gray-300 font-bold">LIVE BALANCER ACTIVE</span>
        </div>
    </div>

    <div id="production-input-grid" class="flex flex-row gap-6 flex-1 w-full overflow-hidden items-stretch justify-start">
        <div class="p-4 bg-gray-800 rounded-xl text-center text-gray-500 w-full flex items-center justify-center animate-pulse">
            Constructing vertical tracking columns...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function updateProductionInputDashboard() {
        try {
            const response = await fetch(`/api/stock/data?t=${new Date().getTime()}`);
            if (!response.ok) return;
            const data = await response.json();
            
            const gridContainer = document.getElementById('production-input-grid');
            gridContainer.innerHTML = '';

            const productEntries = Object.entries(data);
            if (productEntries.length === 0) return;

            for (const [productId, product] of productEntries) {
                const totalH = product.total_housings;
                const totalC = product.total_covers;
                const palletH = product.raw_pallet_count.housings;
                const palletC = product.raw_pallet_count.covers;
                
                // Extract thresholds from product config
                const isActive = product.is_active !== false;
                const minStockPcs = product.thresholds.min_stock_pcs || 1000;
                const maxStockPcs = product.thresholds.max_stock_pcs || 5000;
                const housingPalletQty = product.thresholds.housing_pallet_qty || 500;
                const coverPalletQty = product.thresholds.cover_pallet_qty || 1000;
                
                // Calculate matching 1:1 pairs available to assemble
                const readyAssemblySets = Math.min(totalH, totalC);

                // Convert matching sets to full pallets based on housing pallet layout size
                const totalPallets = Math.max(0, Math.floor(readyAssemblySets / housingPalletQty));
                
                // INDIVIDUAL MIN/MAX THRESHOLDS (50/50 splits)
                const minHousingPcs = minStockPcs / 2;
                const minCoverPcs = minStockPcs / 2;
                const maxHousingPcs = maxStockPcs / 2;
                const maxCoverPcs = maxStockPcs / 2;

                // 🛠️ FIX: Calculate separate 120% visual ceilings for each individual pillar 
                const housingCeilingPcs = maxHousingPcs * 1.2;
                const coverCeilingPcs = maxCoverPcs * 1.2;

                // Determine individual element state color sets
                const housingIsLow = totalH < minHousingPcs;
                const coverIsLow = totalC < minCoverPcs;
                
                const housingIsMaxed = totalH >= maxHousingPcs;
                const coverIsMaxed = totalC >= maxCoverPcs;

                // Determine alarm state based on total pieces
                let alarmState = 'normal'; 
                if (!isActive) {
                    alarmState = 'disabled';
                } else if (totalH + totalC <= minStockPcs) {
                    alarmState = 'low'; 
                } else if (totalH + totalC >= maxStockPcs) {
                    alarmState = 'high';
                }
                
                // Demand Indicators
                let demandStatusHTML = '';
                if (totalH === 0 && totalC === 0) {
                    demandStatusHTML = `<div class="bg-gray-900 border border-gray-800 text-gray-500 text-xs py-1 rounded-lg font-black tracking-wider uppercase text-center">EMPTY DEPOT</div>`;
                } else if (totalH < totalC) {
                    demandStatusHTML = `<div class="bg-indigo-600 text-white text-xs py-1 rounded-lg font-black tracking-wider uppercase text-center border border-indigo-400">⚠️ DEMAND: HOUSINGS</div>`;
                } else if (totalC < totalH) {
                    demandStatusHTML = `<div class="bg-purple-600 text-white text-xs py-1 rounded-lg font-black tracking-wider uppercase text-center border border-purple-400">🔮 DEMAND: COVERS</div>`;
                } else {
                    demandStatusHTML = `<div class="bg-emerald-600 text-white text-xs py-1 rounded-lg font-black tracking-wider uppercase text-center">⚖️ BUFFER BALANCED</div>`;
                }

                // 🛠️ FIX: Calculate visual fill heights scaled against their own component ceiling
                const hPillarHeight = Math.min(100, (totalH / housingCeilingPcs) * 100);
                const cPillarHeight = Math.min(100, (totalC / coverCeilingPcs) * 100);

                // 🛠️ FIX: Calculate absolute position percentages relative to their own component ceiling
                // This ensures the MAX line is pushed up to exactly 83.3% height in both columns
                const hMinLinePos = (minHousingPcs / housingCeilingPcs) * 100;
                const hMaxLinePos = (maxHousingPcs / housingCeilingPcs) * 100;
                
                const cMinLinePos = (minCoverPcs / coverCeilingPcs) * 100;
                const cMaxLinePos = (maxCoverPcs / coverCeilingPcs) * 100;

                let cardAlertClasses = "bg-gray-950 border-gray-800"; 
                let cardOverlayHTML = '';
                
                if (alarmState === 'low') {
                    cardAlertClasses = "bg-red-950/40 border-red-900"; 
                } else if (alarmState === 'disabled') {
                    cardAlertClasses = "bg-gray-950 opacity-30 border-gray-700";
                    cardOverlayHTML = `
                        <div class="absolute inset-0 bg-gray-900/70 flex items-center justify-center rounded-2xl z-40 pointer-events-none">
                            <div class="text-center">
                                <div class="text-2xl font-black text-gray-400 mb-1">⛔</div>
                                <div class="text-sm font-black text-gray-400 tracking-wider">LINE PRODUCTION</div>
                                <div class="text-sm font-black text-gray-400 tracking-wider">DISABLED</div>
                            </div>
                        </div>
                    `;
                }

                let housingPillarClasses = 'bg-gray-900/40 border-gray-900';
                if (housingIsMaxed) {
                    housingPillarClasses = 'bg-gray-900/20 border-gray-700 opacity-60';
                } else if (housingIsLow) {
                    housingPillarClasses = 'bg-red-950/30 border-red-500 border-2 animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.15)]';
                }

                let coverPillarClasses = 'bg-gray-900/40 border-gray-900';
                if (coverIsMaxed) {
                    coverPillarClasses = 'bg-gray-900/20 border-gray-700 opacity-60';
                } else if (coverIsLow) {
                    coverPillarClasses = 'bg-red-950/30 border-red-500 border-2 animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.15)]';
                }

                const columnCardHTML = `
                    <div id="card-${productId}" class="flex-1 min-w-[200px] ${cardAlertClasses} border-2 rounded-2xl p-2 flex flex-col justify-between shadow-2xl transition-all duration-300 relative">
                        ${cardOverlayHTML}
                        
                        <div class="shrink-0 text-center border-b border-gray-800/80 pb-1 ${alarmState === 'disabled' ? 'opacity-50' : ''}">
                            <h2 class="text-2xl font-black text-white uppercase tracking-tight line-clamp-1">${product.name}</h2>
                        </div>

                        <div class="mt-2 shrink-0">
                            ${demandStatusHTML}
                        </div>

                        <div class="shrink-0 flex justify-between items-center px-2 py-1 mt-2 bg-gray-900/60 rounded-lg border border-gray-900/40 font-mono ${alarmState === 'disabled' ? 'opacity-50' : ''}">
                            <span class="text-[10px] tracking-wider font-bold text-gray-400 uppercase">Ready Pallets (Sets):</span>
                            <span class="text-sm font-black text-emerald-400">${totalPallets} <span class="text-[10px] font-normal text-gray-500">(${readyAssemblySets.toLocaleString()} Sets)</span></span>
                        </div>

                        <div class="flex-1 grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-gray-800/60 items-stretch overflow-hidden ${alarmState === 'disabled' ? 'opacity-50' : ''}">
                            
                            <div class="flex flex-col justify-between border rounded-xl p-1.5 relative overflow-hidden group transition-all duration-300 ${housingPillarClasses}">
                                <div class="absolute bottom-0 left-0 right-0 transition-all duration-700 ease-out rounded-b-xl z-0 ${housingIsMaxed ? 'bg-gradient-to-t from-gray-700 via-gray-600 to-gray-500' : 'bg-gradient-to-t from-indigo-700 via-indigo-500 to-indigo-400'}" style="height: ${hPillarHeight}%"></div>
                                
                                <div class="absolute left-0 right-0 border-t-2 border-dashed border-amber-500/60 z-10 pointer-events-none flex justify-end" style="bottom: ${hMaxLinePos}%">
                                    <span class="text-[7px] font-mono font-bold text-amber-400 bg-gray-950/80 px-1 rounded-bl select-none uppercase tracking-tighter">MAX</span>
                                </div>
                                <div class="absolute left-0 right-0 border-t-2 border-dashed border-red-500/60 z-10 pointer-events-none flex justify-end" style="bottom: ${hMinLinePos}%">
                                    <span class="text-[7px] font-mono font-bold text-red-400 bg-gray-950/80 px-1 rounded-bl select-none uppercase tracking-tighter">MIN</span>
                                </div>

                                <div class="relative z-20 text-center mix-blend-lighten">
                                    <div class="text-[20px] font-black tracking-widest uppercase font-mono ${housingIsMaxed ? 'text-gray-400' : 'text-indigo-300'}">Housings</div>
                                </div>

                                <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none mix-blend-lighten">
                                    ${housingIsMaxed ? '<div class="text-2xl mb-0.5 animate-bounce drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">⛔</div>' : ''}
                                    <div class="text-5xl font-black font-mono drop-shadow-[0_4px_6px_rgba(0,0,0,0.95)] ${housingIsLow ? 'text-red-500 font-extrabold scale-110' : housingIsMaxed ? 'text-gray-400 line-through decoration-gray-500' : 'text-white'}">${palletH}</div>
                                    <div class="text-[10px] font-bold uppercase tracking-widest font-mono drop-shadow-[0_2px_4px_rgba(0,0,0,0.95)] ${housingIsLow ? 'text-red-400 text-xs' : housingIsMaxed ? 'text-gray-400' : 'text-indigo-200'}">
                                        ${housingIsMaxed ? 'MAXED OUT' : 'Pallets'}
                                    </div>
                                </div>

                                <div class="relative z-20 text-center mt-auto mb-1 mix-blend-lighten">
                                    <div class="text-[10px] font-extrabold font-mono drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] truncate ${housingIsLow ? 'text-red-300 text-xs font-black' : housingIsMaxed ? 'text-gray-400' : 'text-gray-200'}">${totalH.toLocaleString()} Pcs</div>
                                </div>
                                
                                <div class="relative z-30 mt-1 bg-indigo-700/40 border border-indigo-500/50 rounded-md px-1 py-0.5 text-center ${housingIsMaxed ? 'opacity-40 grayscale' : ''}">
                                    <div class="text-[8px] font-bold text-indigo-200 font-mono tracking-wider">
                                        ${product.next_fifo_numbers?.housing ? `#${product.next_fifo_numbers.housing} NEXT` : 'EMPTY'}
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-col justify-between border rounded-xl p-1.5 relative overflow-hidden group transition-all duration-300 ${coverPillarClasses}">
                                <div class="absolute bottom-0 left-0 right-0 transition-all duration-700 ease-out rounded-b-xl z-0 ${coverIsMaxed ? 'bg-gradient-to-t from-gray-700 via-gray-600 to-gray-500' : 'bg-gradient-to-t from-purple-700 via-purple-500 to-purple-400'}" style="height: ${cPillarHeight}%"></div>
                                
                                <div class="absolute left-0 right-0 border-t-2 border-dashed border-amber-500/60 z-10 pointer-events-none flex justify-end" style="bottom: ${cMaxLinePos}%">
                                    <span class="text-[7px] font-mono font-bold text-amber-400 bg-gray-950/80 px-1 rounded-bl select-none uppercase tracking-tighter">MAX</span>
                                </div>
                                <div class="absolute left-0 right-0 border-t-2 border-dashed border-red-500/60 z-10 pointer-events-none flex justify-end" style="bottom: ${cMinLinePos}%">
                                    <span class="text-[7px] font-mono font-bold text-red-400 bg-gray-950/80 px-1 rounded-bl select-none uppercase tracking-tighter">MIN</span>
                                </div>

                                <div class="relative z-20 text-center mix-blend-lighten">
                                    <div class="text-[20px] font-black tracking-widest uppercase font-mono ${coverIsMaxed ? 'text-gray-400' : 'text-purple-300'}">Covers</div>
                                </div>

                                <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none mix-blend-lighten">
                                    ${coverIsMaxed ? '<div class="text-2xl mb-0.5 animate-bounce drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">⛔</div>' : ''}
                                    <div class="text-5xl font-black font-mono drop-shadow-[0_4px_6px_rgba(0,0,0,0.95)] ${coverIsLow ? 'text-red-500 font-extrabold scale-110' : coverIsMaxed ? 'text-gray-400 line-through decoration-gray-500' : 'text-white'}">${palletC}</div>
                                    <div class="text-[10px] font-bold uppercase tracking-widest font-mono drop-shadow-[0_2px_4px_rgba(0,0,0,0.95)] ${coverIsLow ? 'text-red-400 text-xs' : coverIsMaxed ? 'text-gray-400' : 'text-purple-200'}">
                                        ${coverIsMaxed ? 'MAXED OUT' : 'Pallets'}
                                    </div>
                                </div>

                                <div class="relative z-20 text-center mt-auto mb-1 mix-blend-lighten">
                                    <div class="text-[10px] font-extrabold font-mono drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] truncate ${coverIsLow ? 'text-red-300 text-xs font-black' : coverIsMaxed ? 'text-gray-400' : 'text-gray-200'}">${totalC.toLocaleString()} Pcs</div>
                                </div>
                                
                                <div class="relative z-30 mt-1 bg-purple-700/40 border border-purple-500/50 rounded-md px-1 py-0.5 text-center ${coverIsMaxed ? 'opacity-40 grayscale' : ''}">
                                    <div class="text-[8px] font-bold text-purple-200 font-mono tracking-wider">
                                        ${product.next_fifo_numbers?.cover ? `#${product.next_fifo_numbers.cover} NEXT` : 'EMPTY'}
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', columnCardHTML);
            }
        } catch (error) {
            console.error("Failed pulling core buffer metrics:", error);
        }
    }

    updateProductionInputDashboard();
    setInterval(updateProductionInputDashboard, 4000);
</script>
{% endblock %}
