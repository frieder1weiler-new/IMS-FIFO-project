{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col h-[calc(100vh-140px)] space-y-3 overflow-hidden">
    <div class="flex justify-between items-center border-b border-gray-800 pb-2 shrink-0">
        <div>
            <h1 class="text-xl font-black tracking-tight text-white uppercase">Assembly Takeout Pick Queue (FIFO)</h1>
            <p class="text-xs text-gray-400">Scan verification terminal. Consume the designated target batch IDs first.</p>
        </div>
        <div class="flex items-center space-x-2 text-xs bg-gray-800 px-3 py-1 rounded border border-gray-700 font-mono">
            <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span class="text-gray-400 font-bold">FIFO ENFORCEMENT ON</span>
        </div>
    </div>

    <div id="fifo-takeout-grid" class="flex flex-row flex-wrap gap-4 flex-1 w-full overflow-hidden items-stretch content-stretch">
        <div class="p-4 bg-gray-800 rounded-lg animate-pulse text-center text-gray-500 w-full flex items-center justify-center">
            Loading next-up FIFO queues from raw storage engine...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function updateFifoTakeoutDashboard() {
        try {
            const stockRes = await fetch(`/api/stock/data?t=${new Date().getTime()}`);
            const fifoRes = await fetch(`/api/stock/takeout-fifo?t=${new Date().getTime()}`);
            if (!stockRes.ok || !fifoRes.ok) return;

            const stockData = await stockRes.json();
            const fifoData = await fifoRes.json();
            
            const gridContainer = document.getElementById('fifo-takeout-grid');
            gridContainer.innerHTML = ''; 

            const stockMap = {};
            Object.values(stockData).forEach(p => {
                stockMap[p.name] = p.ready_sets;
            });

            const basisClass = fifoData.length <= 3 ? 'flex-1 min-w-[30%]' : 'w-[48%] flex-grow';

            fifoData.forEach(product => {
                const hBatch = product.oldest_housing;
                const cBatch = product.oldest_cover;
                const completeSets = stockMap[product.name] !== undefined ? stockMap[product.name] : 0;

                const housingBlockHTML = hBatch ? `
                    <div class="bg-gray-900 border-l-4 border-indigo-500 px-4 py-3 rounded-r flex flex-row justify-between items-center flex-1 gap-2">
                        <div class="flex flex-col justify-center min-w-[120px]">
                            <div class="text-[10px] uppercase font-black text-indigo-400 font-mono tracking-wider">Next Housing Pallet</div>
                            <div class="text-sm font-bold text-gray-100 font-mono mt-0.5">Qty: <b class="text-white">${hBatch.qty} pcs</b></div>
                            <div class="text-[10px] text-gray-500 font-mono mt-0.5">${hBatch.timestamp.split(" ")[1] || ''}</div>
                        </div>
                        <div class="flex items-center justify-end gap-1 flex-1 select-all">
                            ${hBatch.fifo_number ? `<span class="text-3xl font-black text-amber-400 font-mono tracking-wider">${hBatch.fifo_number}</span>` : ''}
                            <span class="text-3xl font-light text-gray-500">${hBatch.fifo_number ? ';' : ''}</span>
                            <span class="text-3xl font-normal text-gray-200 font-mono tracking-wider truncate">${hBatch.batch_id}</span>
                        </div>
                    </div>
                ` : `
                    <div class="bg-gray-900/50 border border-dashed border-gray-800 rounded px-3 py-4 text-center text-gray-600 text-xs font-mono flex items-center justify-center flex-1">
                        HOUSINGS DEPLETED
                    </div>
                `;

                const coverBlockHTML = cBatch ? `
                    <div class="bg-gray-900 border-l-4 border-purple-500 px-4 py-3 rounded-r flex flex-row justify-between items-center flex-1 gap-2">
                        <div class="flex flex-col justify-center min-w-[120px]">
                            <div class="text-[10px] uppercase font-black text-purple-400 font-mono tracking-wider">Next Cover Pallet</div>
                            <div class="text-sm font-bold text-gray-100 font-mono mt-0.5">Qty: <b class="text-white">${cBatch.qty} pcs</b></div>
                            <div class="text-[10px] text-gray-500 font-mono mt-0.5">${cBatch.timestamp.split(" ")[1] || ''}</div>
                        </div>
                        <div class="flex items-center justify-end gap-1 flex-1 select-all">
                            ${cBatch.fifo_number ? `<span class="text-3xl font-black text-purple-400 font-mono tracking-wider">${cBatch.fifo_number}</span>` : ''}
                            <span class="text-3xl font-light text-gray-500">${cBatch.fifo_number ? ';' : ''}</span>
                            <span class="text-3xl font-normal text-gray-200 font-mono tracking-wider truncate">${cBatch.batch_id}</span>
                        </div>
                    </div>
                ` : `
                    <div class="bg-gray-900/50 border border-dashed border-gray-800 rounded px-3 py-4 text-center text-gray-600 text-xs font-mono flex items-center justify-center flex-1">
                        COVERS DEPLETED
                    </div>
                `;

                const cardHTML = `
                    <div class="${basisClass} bg-gray-800 border border-gray-700 rounded-xl p-4 flex flex-col justify-between shadow-md">
                        <div class="flex justify-between items-baseline border-b border-gray-700 pb-2 mb-2 shrink-0">
                            <h2 class="text-base font-black text-white tracking-tight uppercase truncate max-w-[200px]">${product.name}</h2>
                            <span class="text-xs font-bold text-emerald-400 bg-emerald-950 border border-emerald-900 px-2 py-0.5 rounded font-mono">
                                ${completeSets.toLocaleString()} <span class="text-[9px] font-normal text-gray-400">SETS</span>
                            </span>
                        </div>
                        
                        <div class="flex-1 flex flex-col gap-3 justify-stretch">
                            ${housingBlockHTML}
                            ${coverBlockHTML}
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        } catch (error) {
            console.error("Failed handling real-time FIFO extraction loop:", error);
        }
    }

    updateFifoTakeoutDashboard();
    setInterval(updateFifoTakeoutDashboard, 4000);
</script>
{% endblock %}
