<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hardware Scanner Interface Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-400 font-mono min-h-screen flex flex-col justify-center items-center p-6 select-none">

    <div class="max-w-xl w-full bg-gray-900 border border-gray-800 rounded-xl p-8 space-y-6 shadow-2xl">
        <div class="text-center">
            <h1 class="text-xl font-bold tracking-widest text-emerald-500">SMART HARDWARE INTERCEPTOR ACTIVE</h1>
            <p class="text-xs text-gray-500 mt-1">Hands-free mode. Scanner data is analyzed automatically based on active database records.</p>
        </div>

        <div id="status-card" class="border border-gray-800 bg-gray-950 rounded-lg p-6 text-center transition-all duration-300">
            <span id="operation-badge" class="text-xs font-bold text-gray-500 block mb-2">🔄 SYSTEM READY</span>
            
            <textarea id="smart-hw-catcher" class="w-1 h-1 opacity-0 absolute pointer-events-none" autofocus></textarea>
            
            <div class="flex items-center justify-center space-x-2">
                <div id="terminal-state" class="text-lg font-black text-gray-300">AWAITING BARCODE SCAN...</div>
                <div id="watchdog-countdown" class="text-sm text-amber-500 font-bold hidden"></div>
            </div>
            <div id="terminal-subtext" class="text-xs text-gray-600 mt-2 truncate">Scan Product Label (Inbound) or Batch Code (Outbound)</div>
        </div>
        
        <div id="terminal-feed" class="bg-black/40 border border-gray-800 rounded p-3 h-40 overflow-y-auto text-[10px] text-gray-500 space-y-1">
            <div>[SYSTEM]: Intelligent IO Listeners Online. Fetching component data profiles...</div>
        </div>
    </div>

    <script>
        const scannerCatcher = document.getElementById('smart-hw-catcher');
        const termFeed = document.getElementById('terminal-feed');
        const statusCard = document.getElementById('status-card');
        const opBadge = document.getElementById('operation-badge');
        const stateText = document.getElementById('terminal-state');
        const subText = document.getElementById('terminal-subtext');
        const countdownDisplay = document.getElementById('watchdog-countdown');
        
        // Internal State Core Variables
        let currentInboundProduct = null;
        let inboundTimer = null;
        let countdownInterval = null;
        const TIMEOUT_DURATION = 120; 

        // 🛠️ DYNAMIC CONFIG: Initialized empty, pulled from backend on window load
        let VALID_PRODUCTS = [];

        // Fetch valid product codes from your central server data file mapping
        async function loadProductConfigurations() {
            try {
                const response = await fetch('/api/stock/data'); // Points to your active config data
                if (response.ok) {
                    const data = await response.json();
                    VALID_PRODUCTS = Object.keys(data); // Extracts names like ["Honda LH", "Honda RH"]
                    trace(`Config Synced: Loaded ${VALID_PRODUCTS.length} authorized product profiles directly from storage core.`, "success");
                } else {
                    trace("Configuration Warning: Could not reach stock configuration maps. Falling back to default codes.", "error");
                    VALID_PRODUCTS = ["Honda LH", "Honda RH", "Toyota LH", "Toyota RH"];
                }
            } catch (err) {
                trace("Critical: Network configuration load failed. Using hardcoded fallback profiles.", "error");
                VALID_PRODUCTS = ["Honda LH", "Honda RH", "Toyota LH", "Toyota RH"];
            }
        }

        // Maintain continuous focus on input node so background scanning stays bulletproof
        document.addEventListener('click', () => { scannerCatcher.focus(); });
        window.addEventListener('load', () => { 
            scannerCatcher.focus();
            loadProductConfigurations();
        });
        
        function trace(msg, status="info") {
            const color = status === "success" ? "text-green-400" : (status === "error" ? "text-red-400" : "text-gray-400");
            termFeed.insertAdjacentHTML('beforeend', `<div class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`);
            termFeed.scrollTop = termFeed.scrollHeight;
        }

        function resetTerminalEngine(mode = "standby") {
            currentInboundProduct = null;
            if (inboundTimer) clearTimeout(inboundTimer);
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownDisplay.classList.add('hidden');
            statusCard.className = "border border-gray-800 bg-gray-950 rounded-lg p-6 text-center transition-all duration-300";
            opBadge.className = "text-xs font-bold text-gray-500 block mb-2";
            opBadge.innerText = "🔄 SYSTEM READY";
            stateText.className = "text-lg font-black text-gray-300";
            stateText.innerText = "AWAITING BARCODE SCAN...";
            subText.className = "text-xs text-gray-600 mt-2 truncate";
            
            if (mode === "timeout") {
                trace("Sequence Expired: 2 Minutes elapsed without Batch ID entry. Resetting transaction channel.", "error");
                subText.innerText = "Session timeout reset. Waiting for next instruction.";
            } else {
                subText.innerText = "Scan Product Label (Inbound) or Batch Code (Outbound)";
            }
        }

        function startInboundWatchdog() {
            let secondsLeft = TIMEOUT_DURATION;
            if (inboundTimer) clearTimeout(inboundTimer);
            if (countdownInterval) clearInterval(countdownInterval);

            countdownDisplay.classList.remove('hidden');
            countdownDisplay.innerText = `(${secondsLeft}s)`;

            countdownInterval = setInterval(() => {
                secondsLeft--;
                countdownDisplay.innerText = `(${secondsLeft}s)`;
                if (secondsLeft <= 0) clearInterval(countdownInterval);
            }, 1000);

            inboundTimer = setTimeout(() => { resetTerminalEngine("timeout"); }, TIMEOUT_DURATION * 1000);
        }

        // Central Hardware Message Interceptor Engine
        scannerCatcher.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const rawVal = this.value.trim();
                this.value = ''; 
                if (!rawVal) return;

                const isProductCode = rawVal.includes('!');

                // --- CASE 1: OPERATOR SCANNED A COMPONENT PRODUCT ID PREFIX (e.g. Honda RH!housing) ---
                if (isProductCode) {
                    const splitIndex = rawVal.lastIndexOf('!');
                    const prodId = rawVal.substring(0, splitIndex).trim();
                    const partType = rawVal.substring(splitIndex + 1).trim().toLowerCase();

                    const isValidPrefix = VALID_PRODUCTS.includes(prodId);

                    if (isValidPrefix && partType !== "housing" && partType !== "cover") {
                        trace(`Format Error: Product "${prodId}" valid, but suffix "${partType}" is incorrect. Must be housing or cover.`, "error");
                        stateText.innerText = "❌ BAD PART TYPE";
                        setTimeout(() => { resetTerminalEngine(); }, 3000);
                        return;
                    }

                    if (!isValidPrefix) {
                        trace(`Validation Failure: Scanned product prefix "${prodId}" does not match active config layout.`, "error");
                        stateText.innerText = "❌ UNKNOWN PRODUCT";
                        setTimeout(() => { resetTerminalEngine(); }, 3000);
                        return;
                    }

                    // Set state machine flag to stage inbound tracking mode
                    currentInboundProduct = { id: prodId, type: partType };
                    
                    statusCard.className = "border border-blue-900 bg-blue-950/20 rounded-lg p-6 text-center transition-all duration-300 animate-pulse";
                    opBadge.className = "text-xs font-bold text-blue-400 block mb-2";
                    opBadge.innerText = "📥 INBOUND TRANSACTION STAGED";
                    stateText.className = "text-lg font-black text-blue-300";
                    stateText.innerText = "AWAITING BATCH ID CODE...";
                    subText.className = "text-xs text-blue-400/80 mt-2 truncate";
                    subText.innerText = `Target: ${prodId} (${partType})`;
                    
                    trace(`Inbound Initialized: Target mapped to [${prodId}]. Pass batch tag through scanner to commit...`, "info");
                    startInboundWatchdog();
                    return;
                }

                // --- CASE 2: OPERATOR SCANNED A RAW BATCH ID BARCODE TAG (e.g. B2026-M99) ---
                const batchId = rawVal;

                // Sub-Check Rule A: System is currently staging a two-part Inbound entry
                if (currentInboundProduct) {
                    trace(`Inbound Step 2: Validating uniqueness for Batch Code [${batchId}]...`);
                    
                    try {
                        // Check backend API to see if this batch exists before adding it
                        const checkResponse = await fetch(`/api/scan/out`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ batch_id: batchId })
                        });
                        
                        // If endpoint returns ok, it means the batch ALREADY exists in the database.
                        if (checkResponse.ok) {
                            trace(`Operational Error: Batch [${batchId}] already exists in active storage. Inbound entry denied to prevent duplication.`, "error");
                            stateText.className = "text-lg font-black text-red-400";
                            stateText.innerText = "❌ DUPLICATE BATCH MISTAKE";
                            setTimeout(() => { resetTerminalEngine(); }, 4000);
                            return;
                        }

                        // Batch code doesn't exist yet, proceed with processing inbound check-in
                        const response = await fetch('/api/scan/in', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                product_id: currentInboundProduct.id,
                                part_type: currentInboundProduct.type,
                                batch_id: batchId
                            })
                        });
                        const resData = await response.json();
                        
                        if (response.ok) {
                            trace(`Inbound Confirmed: ${resData.message || 'Pallet added successfully.'}`, "success");
                            statusCard.className = "border border-green-900 bg-green-950/20 rounded-lg p-6 text-center transition-all duration-300";
                            stateText.className = "text-lg font-black text-green-400";
                            stateText.innerText = "✅ INBOUND STORAGE SUCCESS";
                            subText.innerText = `Added Batch: ${batchId}`;
                        } else {
                            trace(`Inbound Rejected: ${resData.message}`, "error");
                            stateText.innerText = "❌ DATABASE REJECTION";
                        }
                    } catch (err) {
                        trace("Communication break encountered handling inbound check-in transaction.", "error");
                    }
                    
                    setTimeout(() => { resetTerminalEngine(); }, 2500);

                } else {
                    // Sub-Check Rule B: No product staging in memory. Treat this purely as an Outbound removal request.
                    trace(`Outbound Request: Scanning matrix file records for Batch Code [${batchId}]...`);

                    try {
                        const response = await fetch('/api/scan/out', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ batch_id: batchId })
                        });
                        const resData = await response.json();
                        
                        if (response.ok) {
                            trace(`Outbound Confirmed: ${resData.message || 'Pallet removed from system.'}`, "success");
                            statusCard.className = "border border-red-900 bg-red-950/20 rounded-lg p-6 text-center transition-all duration-300";
                            opBadge.className = "text-xs font-bold text-red-400 block mb-2";
                            opBadge.innerText = "📤 OUTBOUND TRANSACTION COMPLETE";
                            stateText.className = "text-lg font-black text-red-400";
                            stateText.innerText = "✅ BATCH REMOVED / CONSUMED";
                            subText.className = "text-xs text-red-400/80 mt-2 truncate";
                            subText.innerText = `Dispatched Pallet ID: ${batchId}`;
                        } else {
                            // API returned an error, meaning this batch code does not exist in the active warehouse database
                            trace(`Outbound Refused: Batch [${batchId}] not found in system storage. Did you mean to scan a Product Label first?`, "error");
                            statusCard.className = "border border-amber-900 bg-amber-950/20 rounded-lg p-6 text-center transition-all duration-300";
                            opBadge.className = "text-xs font-bold text-amber-400 block mb-2";
                            opBadge.innerText = "⚠️ UNKNOWN SEQUENCE FAULT";
                            stateText.className = "text-lg font-black text-amber-500";
                            stateText.innerText = "❌ BATCH ID NOT FOUND";
                            subText.className = "text-xs text-amber-400/80 mt-2";
                            subText.innerText = "Scan a valid product identification tag to check this item in as fresh stock.";
                        }
                    } catch (err) {
                        trace("Communication break encountered handling outbound consumption transaction.", "error");
                    }

                    setTimeout(() => { resetTerminalEngine(); }, 3500);
                }
            }
        });
    </script>
</body>
</html>
